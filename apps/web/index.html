<!doctype html>
<html lang="pt-BR" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7fa" />
    <link rel="icon" type="image/png" href="/src/assets/images/app-icon-512.png" />
    <link rel="apple-touch-icon" href="/src/assets/images/apple-touch-icon.png" />
    <title>Rota Certa Gestão</title>
    <script>
      // Aplica o tema salvo antes da primeira pintura, para não piscar o claro antes do escuro
      ;(function () {
        try {
          var mode = localStorage.getItem('rc-theme') || 'system'
          var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.setAttribute('data-bs-theme', dark ? 'dark' : 'light')
          if (dark) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0f1a21')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
